name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ "18", "20", "22", "24" ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  lint:
    name: Static analysis (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  coverage:
    name: Coverage gate (>=90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Coverage
        run: npm run coverage

  conformance:
    name: Conformance suite in sync
    runs-on: ubuntu-latest
    env:
      BQ_CONFORMANCE_VERSION: "1.6.0"
      # sha256 of that release's fetch.sh: the script runs on the runner, so it is pinned rather than
      # trusted from a mutable tag. Bump together with BQ_CONFORMANCE_VERSION.
      BQ_FETCH_SH_SHA256: 8bb6ba567b288fb0ac71a70fd17041b2503df119e01998d76fdad372570bf849
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch fetch.sh from the pinned conformance tag
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/fetch.sh" \
            "https://raw.githubusercontent.com/BabelQueue/conformance/v${BQ_CONFORMANCE_VERSION}/fetch.sh"
          echo "${BQ_FETCH_SH_SHA256}  $RUNNER_TEMP/fetch.sh" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/fetch.sh"

      - name: Verify vendored conformance matches the release asset
        run: |
          # Downloads babelqueue-conformance-<version>.tar.gz, verifies it against SHA256SUMS,
          # then diffs it with the vendored copy (exit 1 on drift).
          "$RUNNER_TEMP/fetch.sh" --check "$BQ_CONFORMANCE_VERSION" test/conformance

      - name: Test (writes results.json)
        env:
          BQ_CONFORMANCE_RESULTS: ${{ runner.temp }}/results.json
        run: npm test

      - name: Validate results.json against the schema
        run: |
          pipx run check-jsonschema==0.33.0 \
            --schemafile test/conformance/schema/results.schema.json \
            "$RUNNER_TEMP/results.json"

      - name: Fail on missing bindings, missing sections or failing cases
        run: node scripts/check-conformance-results.cjs "$RUNNER_TEMP/results.json" test/conformance/manifest.json package.json src

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [test, lint, coverage, conformance]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job did not pass
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
