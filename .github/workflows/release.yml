name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (writes results.json)
        env:
          BQ_CONFORMANCE_RESULTS: ${{ github.workspace }}/results.json
        run: npm test

      - name: Validate results.json against the schema
        run: |
          pipx run check-jsonschema==0.33.0 \
            --schemafile test/conformance/schema/results.schema.json \
            results.json

      - name: Fail on missing bindings, missing sections or failing cases
        run: node scripts/check-conformance-results.cjs results.json test/conformance/manifest.json package.json src

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: results.json
